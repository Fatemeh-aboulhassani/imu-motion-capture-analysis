[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "imu_motion_capture_analysis"
version = "0.0.1"
description = "analysis of IMU and motion capture data for biomechanical movement assessment"
authors = [
  { name = "TU Darmstadt" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.8.0"


[tool.ruff]
line-length = 99
src = ["imu_motion_capture_analysis"]
include = ["pyproject.toml", "imu_motion_capture_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["imu_motion_capture_analysis"]
force-sort-within-sections = true

